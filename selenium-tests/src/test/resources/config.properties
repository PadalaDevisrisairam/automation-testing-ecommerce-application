# ============================================================
#  Test Configuration — ecommerce-automation-poc
# ============================================================

# Application URLs
base.url=http://localhost:5173
api.url=http://localhost:8000

# Browser: chrome | firefox | edge
browser=chrome

# Run headless (true/false)
headless=false

# Implicit wait in seconds
implicit.wait=10

# Page-load timeout in seconds
page.load.timeout=30

# Screenshot on failure (true/false)
screenshot.on.failure=true

# Screenshot output directory
screenshot.dir=target/screenshots

# ExtentReports output directory
report.dir=target/reports

# ============================================================
#  Test Credentials
# ============================================================
valid.email=test@example.com
valid.password=password123

invalid.email=wrong@example.com
invalid.password=wrongpassword
